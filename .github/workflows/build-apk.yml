name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build-apk:
    name: Test & Build UltraLight APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Unit Tests
        run: gradle testDebugUnitTest
      - name: Build R8-Optimized Release APK
        run: gradle assembleRelease
      - name: Report APK Size in Summary
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            SIZE_KB=$(du -k "$APK_PATH" | cut -f1)
            echo "### 📦 UltraLight PDF Viewer APK Generado" >> $GITHUB_STEP_SUMMARY
            echo "- **Archivo**: \`app-release.apk\` (Firmado y optimizado con R8)" >> $GITHUB_STEP_SUMMARY
            echo "- **Tamaño final**: **${SIZE_KB} KB**" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload Ready-to-Install Release APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraLightPdfViewer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
